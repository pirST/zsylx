services:
  zsylx:
    build:
      context: .
      args:
        # Пусто => рекомендованные (протестированные) версии из constants.sh.
        # Можно зафиксировать, например: ZAPRET_VERSION: v72.9
        ZAPRET_VERSION: ""
        # ВНИМАНИЕ: это git-ветка/тег/коммит РЕПОЗИТОРИЯ стратегий Flowseal
        # (напр. "main" или хеш коммита), а НЕ имя .bat-файла.
        # Чтобы выбрать конкретную стратегию — используйте STRATEGY ниже.
        STRATEGY_VERSION: ""
        XRAY_VERSION: v26.3.27
        DNSPROXY_VERSION: v0.84.1
        # CN самоподписанного TLS-серта, который кладётся в образ на сборке
        # (потом можно перевыпустить: docker exec zsylx gen-doh-cert ...)
        DNSPROXY_TLS_CN: localhost
    image: zsylx:latest
    container_name: zsylx
    restart: unless-stopped

    # NET_ADMIN обязателен для nftables/NFQUEUE.
    cap_add:
      - NET_ADMIN
    # На хосте должен быть загружен модуль ядра nfnetlink_queue:
    #   sudo modprobe nfnetlink_queue
    sysctls:
      - net.ipv4.conf.all.route_localnet=1

    ports:
      - "1080:1080/tcp"   # SOCKS5
      - "1080:1080/udp"   # SOCKS5 (UDP associate)
      - "8080:8080/tcp"   # HTTP-прокси
      - "53:53/tcp"       # dnsproxy (plain DNS, внешние клиенты)
      - "53:53/udp"       # dnsproxy (plain DNS, внешние клиенты)
      - "443:443/tcp"     # dnsproxy DoH-сервер

    environment:
      # Стратегия обхода DPI (имя .bat файла из zapret-latest/ или custom-strategies/)
      STRATEGY: general_alt9.bat
      INTERFACE: any
      SOCKS_PORT: "1080"
      HTTP_PORT: "8080"
      ENABLE_HTTP: "true"
      # Раскомментируйте для авторизации (общие логин/пароль для SOCKS5 и HTTP):
      # PROXY_USER: user
      # PROXY_PASS: secret

      # Аргументы командной строки dnsproxy. Пусто — не запускается.
      # Резолвер контейнера не меняется; dnsproxy только для внешних клиентов.
      # Пример DoH-сервера (серта из образа: /opt/dnsproxy/tls/):
      # DNSPROXY_CONF: "-l 0.0.0.0 -p 53 -s 443 -c /opt/dnsproxy/tls/cert.pem -k /opt/dnsproxy/tls/key.pem -u https://dns.google/dns-query --cache"
      DNSPROXY_CONF: ""
      # Домены и IP, которые nfqws обрабатывает сверх списков стратегии.
      # Нужны хосты/IP DoH-апстримов, иначе DPI их не обойдёт.
      # dns.google dns.google.com cloudflare-dns.com one.one.one.one mozilla.cloudflare-dns.com dns.adguard-dns.com 8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1
      ZAPRET_EXTRA_HOSTS: ""

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 300s
      timeout: 15s
      start_period: 20s
      retries: 3
